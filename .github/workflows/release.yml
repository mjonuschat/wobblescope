name: Release
# `cargo release` bumps the version, commits it, tags v<version> and pushes both. The tag starts
# this workflow: it checks the tag, runs the same checks and builds as CI (ci.yml, concurrently),
# and only when all of them pass publishes a release with the assets: the three binaries,
# SHA256SUMS over them, and the installer script with its checksum. The publish job checks that
# every asset is there first, because Moonraker falls back to the first asset when none matches
# `asset_name`.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-**'  # Pre-release versions
      - 'v[0-9]+.[0-9]+.[0-9]+'     # Release versions
  # Runs the checks and builds without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main."
            exit 1
          fi
      - name: Check that the tag matches the crate version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wobblescope") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crate version v${VERSION}."
            exit 1
          fi

  # Checks and the three builds run side by side. A skipped `verify` (a manual run) does not block.
  ci:
    name: CI
    needs: [verify]
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    uses: ./.github/workflows/ci.yml
    with:
      dist: true
    permissions:
      contents: read
      pull-requests: read

  publish:
    name: Publish release
    needs: [ci]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - name: Check that all three binaries are there
        run: |
          find dist -type f -ls
          for asset in wobblescope-aarch64 wobblescope-armv7 wobblescope-x86_64; do
            test -s "dist/$asset" || { echo "missing asset $asset"; exit 1; }
          done
          test "$(find dist -type f | wc -l)" -eq 3
      - name: Checksum the binaries
        run: cd dist && sha256sum wobblescope-aarch64 wobblescope-armv7 wobblescope-x86_64 > SHA256SUMS
      - name: Build the installer
        run: |
          make installer
          cp build/wobblescope-installer.sh build/wobblescope-installer.sh.sha256 dist/
      - name: Check the assets
        run: |
          for asset in wobblescope-aarch64 wobblescope-armv7 wobblescope-x86_64 SHA256SUMS \
            wobblescope-installer.sh wobblescope-installer.sh.sha256; do
            test -s "dist/$asset" || { echo "missing asset $asset"; exit 1; }
          done
          test "$(find dist -type f | wc -l)" -eq 6
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Upload the assets to the release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          # Moonraker compares the release title with the version in release_info.json, so
          # the title must be the bare tag.
          release_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite: true
          body: ${{ steps.changelog.outputs.content }}
