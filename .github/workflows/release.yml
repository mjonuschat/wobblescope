name: Release
# Pushing a v<version> tag builds the three release assets Moonraker's update manager expects and
# attaches them to a DRAFT release. Publish the draft by hand once all three assets are there:
# Moonraker falls back to the first asset when none matches `asset_name`, so a published release
# must never be missing one.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-**'  # Pre-release versions
      - 'v[0-9]+.[0-9]+.[0-9]+'     # Release versions
  workflow_dispatch:

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tag matches the crate version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wobblescope") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crate version v${VERSION}."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI at the locked version
        id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $3); print $3; exit}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  dist:
    name: Dist (${{ matrix.build }})
    needs: [web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        build: [x86_64-linux, aarch64-linux, armv7l-linux]
        include:
          # `asset` is the exact name Moonraker's release_info.json asks for; setup derives it
          # from the binary's own architecture, so these three names must not change.
          - build: x86_64-linux
            target: x86_64-unknown-linux-musl
            asset: wobblescope-x86_64
          - build: aarch64-linux
            target: aarch64-unknown-linux-musl
            asset: wobblescope-aarch64
          - build: armv7l-linux
            target: armv7-unknown-linux-musleabihf
            asset: wobblescope-armv7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tool
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Install ARM binary tools
        if: matrix.build != 'x86_64-linux'
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Run cargo test
        if: matrix.build == 'x86_64-linux'
        run: cross test --target ${{ matrix.target }} --locked
      - name: Build release binary
        run: cross build --target ${{ matrix.target }} --release --locked -p wobblescope
      - name: Verify static binary
        run: |
          BINARY="target/${{ matrix.target }}/release/wobblescope"
          if readelf --dynamic "$BINARY" | grep --quiet '(NEEDED)'; then
            echo "$BINARY has dynamic library dependencies."
            exit 1
          fi
      - name: Strip binary
        run: |
          case "${{ matrix.build }}" in
            aarch64-linux) STRIP_CMD="aarch64-linux-gnu-strip" ;;
            armv7l-linux) STRIP_CMD="arm-linux-gnueabihf-strip" ;;
            *) STRIP_CMD="strip" ;;
          esac
          "$STRIP_CMD" --strip-unneeded "target/${{ matrix.target }}/release/wobblescope"
      - name: Name the binary as its release asset
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/wobblescope" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.build }}
          path: dist/${{ matrix.asset }}

  draft:
    if: ${{ github.ref_type == 'tag' }}
    name: Draft release
    needs: [dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - name: Check that all three assets are there
        run: |
          ls -al dist
          for asset in wobblescope-aarch64 wobblescope-armv7 wobblescope-x86_64; do
            test -s "dist/$asset" || { echo "missing asset $asset"; exit 1; }
          done
          test "$(ls dist | wc -l)" -eq 3
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=""
            case "$TAG" in *-*) flags="--prerelease" ;; esac
            gh release create "$TAG" dist/* --draft --verify-tag $flags \
              --title "wobblescope $TAG" --notes-file CHANGES.md
          fi
