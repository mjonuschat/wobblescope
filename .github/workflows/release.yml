name: Release
# `cargo release` bumps the version, commits it, tags v<version> and pushes both. The tag starts
# this workflow: it checks the tag, runs the same checks and builds as CI (ci.yml, concurrently),
# and only when all of them pass attaches the three assets to a DRAFT release. Publish the draft
# by hand once all three assets are there: Moonraker falls back to the first asset when none
# matches `asset_name`, so a published release must never be missing one.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-**'  # Pre-release versions
      - 'v[0-9]+.[0-9]+.[0-9]+'     # Release versions
  # Runs the checks and builds without drafting a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main."
            exit 1
          fi
      - name: Check that the tag matches the crate version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wobblescope") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crate version v${VERSION}."
            exit 1
          fi

  # Checks and the three builds run side by side. A skipped `verify` (a manual run) does not block.
  ci:
    name: CI
    needs: [verify]
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    uses: ./.github/workflows/ci.yml
    with:
      dist: true
    permissions:
      contents: read
      pull-requests: read

  draft:
    name: Draft release
    needs: [ci]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - name: Check that all three assets are there
        run: |
          find dist -type f -ls
          for asset in wobblescope-aarch64 wobblescope-armv7 wobblescope-x86_64; do
            test -s "dist/$asset" || { echo "missing asset $asset"; exit 1; }
          done
          test "$(find dist -type f | wc -l)" -eq 3
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=""
            case "$TAG" in *-*) flags="--prerelease" ;; esac
            gh release create "$TAG" dist/* --draft --verify-tag $flags \
              --title "wobblescope $TAG" --notes-file CHANGES.md
          fi
