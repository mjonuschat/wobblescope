name: Build
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    name: Check
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  test:
    name: Test Suite
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  lints:
    name: Lints
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check dependency file changes
        id: dependency-files
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Eq '(^|/)Cargo\.toml$|^Cargo\.lock$|^deny\.toml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/checkout@v6
        if: ${{ github.event_name != 'pull_request' || steps.dependency-files.outputs.changed == 'true' }}
      - name: Install cargo-audit
        if: ${{ github.event_name != 'pull_request' || steps.dependency-files.outputs.changed == 'true' }}
        run: |
          VERSION=$(gh api repos/rustsec/rustsec/releases --jq '[.[].tag_name | select(startswith("cargo-audit/"))][0] | ltrimstr("cargo-audit/")')
          curl -sSL "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2F${VERSION}/cargo-audit-x86_64-unknown-linux-gnu-${VERSION}.tgz" | tar xz --strip-components=1 -C /usr/local/bin "cargo-audit-x86_64-unknown-linux-gnu-${VERSION}/cargo-audit"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo audit
        if: ${{ github.event_name != 'pull_request' || steps.dependency-files.outputs.changed == 'true' }}
      - name: Skip security audit
        if: ${{ github.event_name == 'pull_request' && steps.dependency-files.outputs.changed != 'true' }}
        run: echo "No Cargo.toml, Cargo.lock, or deny.toml changes in this PR; skipping cargo audit."

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI at the locked version
        id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $3); print $3; exit}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - name: Upload the built web app
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 14

  dist:
    name: Dist (${{ matrix.build }})
    if: ${{ github.event_name == 'push' }}
    needs: [web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [x86_64-linux, aarch64-linux, armv7l-linux]
        include:
          - build: x86_64-linux
            target: x86_64-unknown-linux-musl
          - build: aarch64-linux
            target: aarch64-unknown-linux-musl
          - build: armv7l-linux
            target: armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation tool
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Install ARM binary tools
        if: matrix.build != 'x86_64-linux'
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf
      - name: Build binary
        run: cross build --target ${{ matrix.target }} --release --locked -p wobblescope
      - name: Verify static binary
        run: |
          BINARY="target/${{ matrix.target }}/release/wobblescope"
          if readelf --dynamic "$BINARY" | grep --quiet '(NEEDED)'; then
            echo "$BINARY has dynamic library dependencies."
            exit 1
          fi
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: wobblescope-${{ github.sha }}-${{ matrix.build }}
          path: target/${{ matrix.target }}/release/wobblescope
          retention-days: 14

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check dependency file changes
        id: dependency-files
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Eq '(^|/)Cargo\.toml$|^Cargo\.lock$|^deny\.toml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/checkout@v6
        if: ${{ github.event_name != 'pull_request' || steps.dependency-files.outputs.changed == 'true' }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: ${{ github.event_name != 'pull_request' || steps.dependency-files.outputs.changed == 'true' }}
      - name: Skip dependency check
        if: ${{ github.event_name == 'pull_request' && steps.dependency-files.outputs.changed != 'true' }}
        run: echo "No Cargo.toml, Cargo.lock, or deny.toml changes in this PR; skipping cargo-deny."
