[package]
name = "wobblescope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wobblescope service: captures accelerometer data via Moonraker and serves the web UI"

[dependencies]
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.1.8"
wobblescope-session = { version = "0.1.0", path = "../session" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
wobblescope-core = { path = "../core" }
