[package]
name = "wobblescope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wobblescope service: captures accelerometer data via Moonraker and serves the web UI"

[features]
ts = ["dep:ts-rs", "wobblescope-session/ts"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mime_guess = "2.0.5"
regex = "1.13.1"
rust-embed = "8.13.0"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
toml = "1.1.8"
ts-rs = { version = "12.0.1", optional = true }
wobblescope-core = { version = "0.1.0", path = "../core" }
wobblescope-session = { version = "0.1.0", path = "../session" }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
structured-zstd = { version = "0.2.6", default-features = false, features = ["std", "hash"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
