[package]
name = "wobblescope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wobblescope service: captures accelerometer data via Moonraker and serves the web UI"

[dependencies]
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = "8.13.0"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.1.8"
wobblescope-core = { version = "0.1.0", path = "../core" }
wobblescope-session = { version = "0.1.0", path = "../session" }

[lints]
workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1.5"
structured-zstd = { version = "0.2.6", default-features = false, features = ["std", "hash"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
