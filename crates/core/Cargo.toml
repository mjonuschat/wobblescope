[package]
name = "wobblescope-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure DSP for resonance analysis; builds natively and to WASM"

[features]
# Derives TypeScript types for the public data types that cross the API.
ts = ["dep:ts-rs"]

[dependencies]
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
structured-zstd = { version = "0.2.6", default-features = false, features = ["std", "hash"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
